<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>En session</title>
    <script src="./js/creojs.js"></script>
    <script type="text/creojs" src="./js/browser.creojs"></script>

        <script src="./js/mainNavbarButtons.js"></script>
    <script src="./js/mainNavbarGenerator.js"></script>

    <script type="text/creojs" src="./js/enSession.creojs"></script>

    <link rel="stylesheet" href="./css/main.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
   <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body onload="CreoJS.$ADD_ON_LOAD(initialize)">
    <nav id="main-navbar" class="navbar"></nav>


    <div class="info-item">
        <div class="filter">
            <input type="text" id="filenameFilter" placeholder="Rechercher...">
            <div class="type-filters">
                <label class="filter-checkbox"><input type="checkbox" id="modifiedFilter">Modifiés</label>
                <label class="filter-checkbox"><input type="checkbox" id="p00Filter"value="P00">P00</label>
                <label class="filter-checkbox"><input type="checkbox" value="drw">DRW</label>
                <label class="filter-checkbox"><input type="checkbox" value="prt">PRT</label>
                <label class="filter-checkbox"><input type="checkbox" value="asm">ASM</label>
            </div>
        </div>
        <div id="container">
            <table id="models-table">
                <thead>
                    <tr>
                        <th class="col-action">2D</th>
                        <th class="col-action">3D</th>
                        <th class="col-action">FERMER</th>
                        <th>MODÈLE / DS1</th>
                    </tr>
                </thead>
                <tbody id="models-table-body">
                <!-- Les lignes seront insérées ici -->
                </tbody>
            </table>
            <p id="models-empty" class="muted" style="padding:12px 0; display:none;">Aucun modèle en session.</p>
        </div>
    </div>
    <script src="./js/common.js"></script>
    <script src="./js/enSession.js"></script>
</body>
</html>
