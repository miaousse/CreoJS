<html>
<head>
    <title>Nomenclature</title>
    <script src="./js/creojs.js"></script>
    <script type="text/creojs" src="./js/browser.creojs"></script>

    <script src="./js/bom.js"></script>
    <script src="./js/mainNavbarButtons.js"></script>
    <script src="./js/mainNavbarGenerator.js"></script>

    <script type="text/creojs" src="./js/bom.creojs"></script>
    
    <link rel="stylesheet" href="./css/main.css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

</head>
<body onload="CreoJS.$ADD_ON_LOAD(initialize)">
    <nav id="main-navbar" class="navbar"></nav>


    <!-- Barre d'outils -->
    <div class="toolbar">
        <button class="action-icon-btn" id="exportClipboardBtn" title="Exporter en CSV" onclick="exportTableToCSV()">
            <span class="material-symbols-outlined">csv</span>
        </button>
    </div>

    <!-- Titre BOM -->
    <div class="title" id="bomFor">
        <div id="bomfor">
            <span id="fullname"></span>
            <span id="revision" style="display:none;"></span>
            <span id="ds1"></span>
            <span id="ds2" style="display:none;"></span>
            <span id="ds3" style="display:none;"></span>
        </div>
    </div>

    <!-- Filtres -->
    <div class="input-container">
        <input type="text" id="inputField" placeholder="Rechercher dans la nomenclature...">
        <span id="clearButton" class="material-icons">close</span>
        <div class="checkbox-container">
            <input type="checkbox" id="p00Filter">
            <label for="p00Filter">P00</label>
        </div>
        <label for="levelSlider">
            Niveau (1 à <span id="maxLevel">1</span>) :
        </label>
        <input type="range" id="levelSlider" min="1" max="1" value="1">
        <span id="currentLevel">1</span>
    </div>

    <div class="error"></div>
    <div id="displayMessage"></div>

    <div style="padding: 0 24px 24px;">
        <table id="bom">
            <thead>
                <tr>
                    <th style="width:36px">Drw</th>
                    <th style="width:36px">3D</th>
                    <th style="width:36px">#</th>
                    <th style="width:48px">Qté</th>
                    <th>Code</th>
                    <th style="width:60px">Rev</th>
                    <th>Description</th>
                    <th>Matière</th>
                </tr>
            </thead>
        </table>
    </div>
</body>
</html>
