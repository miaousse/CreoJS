<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tâches</title>

    <script src="./js/mainNavbarButtons.js"></script>
    <script src="./js/MainNavbarGenerator.js"></script>
    
    <link rel="stylesheet" href="./css/main.css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <nav id="main-navbar" class="navbar"></nav>


    <div class="info-item">
        <!-- Formulaire saisie -->
        <form id="task-form" autocomplete="off" class="notepad-form">
            <textarea
                id="task-input"
                placeholder="Ajouter une nouvelle tâche..."
                required
                rows="4"
                autofocus
            ></textarea>
            <div>
                <button type="submit" id="add-btn" class="action-icon-btn btn-save" title="Ajouter la tâche">
                    <span class="material-symbols-outlined">add_circle</span>
                </button>
            </div>
        </form>

        <!-- Tableau des tâches -->
        <p class="section-label">Tâches</p>
        <table id="tasks-table">
            <thead>
                <tr>
                    <th style="width:64px"></th>
                    <th>Tâche</th>
                </tr>
            </thead>
            <tbody id="tasks-tbody"></tbody>
        </table>
    </div>

    <script src="./js/toDoList.js"></script>
</body>
</html>
